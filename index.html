<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网站导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32*32" href="images/icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-compass"></i>
                </div>
                <h1>网站导航</h1>
            </div>
            <div class="header-actions">
                <div class="btn-clear" id="resetBtn" title="重置所有数据">
                    <i class="fas fa-rotate-left"></i>
                </div>
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </header>
        
        <div class="search-container">
            <div class="search-bar" id="searchBar">
                <div class="engine-dropdown" id="engineDropdown">
                    <button type="button" class="engine-trigger" id="engineTrigger">
                        <img class="engine-trigger-icon" id="engineTriggerIcon" src="" alt="">
                        <span class="engine-trigger-name" id="engineTriggerName"></span>
                        <i class="fas fa-chevron-down engine-trigger-chevron"></i>
                    </button>
                    <div class="engine-menu" id="engineMenu"></div>
                </div>

                <input type="text" id="searchInput" placeholder="搜索网站，或输入关键词用引擎搜索 (Enter)">

                <i class="fas fa-search search-icon"></i>
                <span class="clear-search" id="clearSearch"><i class="fas fa-times"></i></span>

                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
        </div>
        
        <div class="category-tabs" id="categoryTabs"></div>
        
        <div class="websites-grid" id="websitesGrid"></div>
        
        <div class="custom-site">
            <div class="custom-site-header" id="customHeader">
                <h3><i class="fas fa-plus-circle"></i> 添加自定义网站</h3>
                <i class="fas fa-chevron-down toggle-icon"></i>
            </div>
            <div class="custom-site-body" id="customBody">
                <div class="form-row three-cols">
                    <div class="input-group">
                        <label for="siteName">网站名称 *</label>
                        <input type="text" id="siteName" placeholder="例如：百度">
                    </div>
                    <div class="input-group">
                        <label for="siteUrl">网站网址 *</label>
                        <input type="text" id="siteUrl" placeholder="https://www.baidu.com">
                    </div>
                    <div class="input-group">
                        <label for="siteCategory">分类</label>
                        <div class="category-input-group">
                            <select id="siteCategorySelect" class="category-select"></select>
                            <input type="text" id="siteCategoryInput" class="category-input" placeholder="或输入新分类">
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group" style="flex:2; min-width: 200px;">
                        <label for="siteDesc">描述（可选）</label>
                        <input type="text" id="siteDesc" placeholder="一句话描述这个网站的功能">
                    </div>
                </div>
                
                <div class="icon-picker-container">
                    <label style="display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:var(--text-color);">选择图标（可选）</label>
                    
                    <div class="icon-live-preview">
                        <span class="preview-label">预览：</span>
                        <div class="preview-box" id="iconLivePreview" style="background:#e2e8f0;color:var(--text-secondary);">
                            <i class="fas fa-icons"></i>
                        </div>
                        <span class="preview-label" id="previewDesc" style="margin-left:auto;color:var(--text-secondary);">未选择</span>
                    </div>
                    
                    <div class="icon-picker-trigger" id="iconPickerTrigger">
                        <div class="selected-icon-preview" id="selectedIconPreview" style="background:#e2e8f0;color:var(--text-secondary);">
                            <i class="fas fa-icons"></i>
                        </div>
                        <span class="selected-icon-name placeholder" id="selectedIconName">点击选择预设图标</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="icon-picker-panel" id="iconPickerPanel">
                        <div class="panel-section">
                            <div class="panel-title">① 选择图案</div>
                            <div class="icon-grid" id="iconGrid"></div>
                        </div>
                        <div class="panel-section">
                            <div class="panel-title">② 图案颜色</div>
                            <div class="color-picker-row" id="iconColorRow">
                                <span class="row-label">图案颜色</span>
                                <div class="color-dot selected" data-target="icon" data-color="#ffffff" style="background:#ffffff;border:1px solid #ddd;"></div>
                                <div class="color-dot" data-target="icon" data-color="#2d3748" style="background:#2d3748;"></div>
                                <div class="color-dot" data-target="icon" data-color="#4a6de5" style="background:#4a6de5;"></div>
                                <div class="color-dot" data-target="icon" data-color="#e45369" style="background:#e45369;"></div>
                                <div class="color-dot" data-target="icon" data-color="#07C160" style="background:#07C160;"></div>
                                <div class="color-dot" data-target="icon" data-color="#FB7299" style="background:#FB7299;"></div>
                                <div class="color-dot" data-target="icon" data-color="#FF9800" style="background:#FF9800;"></div>
                                <div class="color-dot" data-target="icon" data-color="#9C27B0" style="background:#9C27B0;"></div>
                                <div class="color-dot" data-target="icon" data-color="#FFC107" style="background:#FFC107;"></div>
                                <div class="color-dot" data-target="icon" data-color="#00BCD4" style="background:#00BCD4;"></div>
                            </div>
                        </div>
                        <div class="panel-section">
                            <div class="panel-title">③ 背景颜色</div>
                            <div class="color-picker-row" id="bgColorRow">
                                <span class="row-label">背景颜色</span>
                                <div class="color-dot selected" data-target="bg" data-color="#4a6de5" style="background:#4a6de5;"></div>
                                <div class="color-dot" data-target="bg" data-color="#FB7299" style="background:#FB7299;"></div>
                                <div class="color-dot" data-target="bg" data-color="#07C160" style="background:#07C160;"></div>
                                <div class="color-dot" data-target="bg" data-color="#DF2029" style="background:#DF2029;"></div>
                                <div class="color-dot" data-target="bg" data-color="#0084FF" style="background:#0084FF;"></div>
                                <div class="color-dot" data-target="bg" data-color="#FE2C55" style="background:#FE2C55;"></div>
                                <div class="color-dot" data-target="bg" data-color="#FF9800" style="background:#FF9800;"></div>
                                <div class="color-dot" data-target="bg" data-color="#9C27B0" style="background:#9C27B0;"></div>
                                <div class="color-dot" data-target="bg" data-color="#795548" style="background:#795548;"></div>
                                <div class="color-dot" data-target="bg" data-color="#607D8B" style="background:#607D8B;"></div>
                                <div class="color-dot" data-target="bg" data-color="#333333" style="background:#333333;"></div>
                                <div class="color-dot" data-target="bg" data-color="#FFC107" style="background:#FFC107;"></div>
                                <div class="color-dot" data-target="bg" data-color="#1e1e1e" style="background:#1e1e1e;"></div>
                                <div class="color-dot" data-target="bg" data-color="#6aa93f" style="background:#6aa93f;"></div>
                                <div class="color-dot" data-target="bg" data-color="#3f87e0" style="background:#3f87e0;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-full" id="addSiteBtn">
                    <i class="fas fa-plus"></i> 添加网站
                </button>
                
                <div class="custom-site-footer">
                    <i class="fas fa-circle-info"></i>
                    右键网站卡片可进行置顶 / 编辑 / 删除操作
                </div>
            </div>
        </div>

        <footer>
            <p>网站导航 | 快速访问常用网站</p><br>
            <p>© L1Nzy 2026</p>
        </footer>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="pinSite">
            <i class="fas fa-thumbtack"></i> 置顶网站
        </div>
        <div class="context-menu-item" id="editSite">
            <i class="fas fa-pen"></i> 编辑网站
        </div>
        <div class="context-menu-item" id="deleteSite">
            <i class="fas fa-trash"></i> 删除网站
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
